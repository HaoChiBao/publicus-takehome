# Railway API service — deploy from repo root.
# In the Railway dashboard, set the service root to this repo (not frontend/).
[build]
builder = "RAILPACK"
buildCommand = "pip install -r requirements-api.txt"

[deploy]
# api/ uses bare imports (from db import …) — run uvicorn with --app-dir api
startCommand = "uvicorn main:app --app-dir api --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
